name: Endfield Notion 개발 로그

# develop로 PR이 "머지"될 때마다 그 PR의 커밋만 읽어 Claude 초안 → Notion 📕 Library DB에
# 상태=초안(카테고리=Endfield Extension 개발로그) 페이지로 게시. 수동 실행(workflow_dispatch)도 지원.
# PR 단위라 daily/직접 commit마다 돌지 않음. 이벤트가 PR 범위·번호를 주므로 '이전 PR id' 저장 불필요.

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      from_sha:
        description: "시작 커밋 SHA (선택, 비우면 자동 판별)"
        required: false
      to_sha:
        description: "종료 커밋 SHA (선택, 기본 HEAD; PR 머지 커밋을 주면 그 PR 범위)"
        required: false

concurrency:
  group: notion-devlog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devlog:
    # PR은 실제 머지된 경우에만(단순 close 제외). 수동 실행은 항상 허용.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 머지 시 머지 커밋을, 수동 실행 시 해당 ref를 체크아웃. 범위 판별에 전체 히스토리 필요.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치 (경량)
        run: pip install anthropic requests python-dotenv

      - name: Notion 개발 로그 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_DEVLOG_TOKEN: ${{ secrets.NOTION_DEVLOG_TOKEN }}
          NOTION_DEVLOG_DATABASE_ID: ${{ vars.NOTION_DEVLOG_DATABASE_ID }}
          INPUT_FROM_SHA: ${{ github.event.inputs.from_sha }}
          INPUT_TO_SHA: ${{ github.event.inputs.to_sha }}
        run: |
          # PR 머지: 체크아웃된 HEAD가 머지 커밋이라 스크립트가 HEAD^1..HEAD(=그 PR 커밋)로
          # 자동 판별하고 PR 번호도 추출. 수동 실행: 입력 SHA가 있으면 그대로 사용.
          ARGS=()
          if [ -n "$INPUT_FROM_SHA" ]; then
            ARGS+=(--from-sha "$INPUT_FROM_SHA")
          fi
          if [ -n "$INPUT_TO_SHA" ]; then
            ARGS+=(--to-sha "$INPUT_TO_SHA")
          fi
          python scripts/notion_devlog.py "${ARGS[@]}"
